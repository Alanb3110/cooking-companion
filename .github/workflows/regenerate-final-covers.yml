name: Regenerate final Char Siu and Satay covers

on:
  push:
    branches:
      - fix/final-char-siu-satay-covers

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/final-char-siu-satay-covers

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Recompose final covers
        run: |
          set -euo pipefail

          # Char Siu: use the intact local pork-tenderloin photography as source,
          # crop to the canonical 4:3 cover and warm the glaze toward char-siu red.
          convert assets/recipes/maple-mustard-soy-pork-tenderloin.webp \
            -resize '720x540^' -gravity center -extent 720x540 \
            -modulate 103,118,100 \
            -channel R -evaluate multiply 1.10 +channel \
            -quality 82 \
            assets/recipes/char-siu-pork-rice-cucumber.webp

          # Satay: use the intact local chicken-skewer photography, recompose and
          # mirror it so it is visually distinct from the teriyaki cover.
          convert assets/recipes/glazed-chicken-skewers-rice.webp \
            -resize '720x540^' -gravity center -extent 720x540 \
            -flop -modulate 103,108,96 \
            -quality 82 \
            assets/recipes/chicken-satay-coconut-rice.webp

      - name: Validate generated WebP files
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          for name in [
              'assets/recipes/char-siu-pork-rice-cucumber.webp',
              'assets/recipes/chicken-satay-coconut-rice.webp',
          ]:
              data = Path(name).read_bytes()
              assert data[:4] == b'RIFF', (name, data[:4])
              assert data[8:12] == b'WEBP', (name, data[8:12])
              assert struct.unpack_from('<I', data, 4)[0] + 8 == len(data), name
              print(name, len(data), 'bytes')
          PY

      - name: Commit regenerated covers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/recipes/char-siu-pork-rice-cucumber.webp assets/recipes/chicken-satay-coconut-rice.webp
          git commit -m 'Regenerate final Char Siu and Satay covers'
          git push origin HEAD:fix/final-char-siu-satay-covers
